<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd9eb">
<title>Sorpresa para Caro 💕</title>
<style>
:root{--pink:#ed69a5;--dark:#5c3650;--cream:#fff9fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--dark);
background:radial-gradient(circle at 20% 10%,#fff 0 4%,transparent 5%),linear-gradient(135deg,#ffe8f3,#eee2ff)}
.card{width:min(560px,100%);background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 18px 55px #9b5c7d33;position:relative;overflow:hidden}
h1{margin:.2em 0;color:#d94e91;font-size:clamp(28px,7vw,44px)}
p{font-size:18px;line-height:1.5}
button,a.button{border:0;border-radius:999px;padding:15px 24px;background:var(--pink);color:#fff;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 8px 20px #ed69a555}
#sorpresa{display:none}
img{width:100%;border-radius:22px;margin:16px 0;box-shadow:0 10px 28px #0002}
.small{font-size:14px;opacity:.75}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:.85}}
</style>
</head>
<body>
<main class="card">
<section id="inicio">
<div style="font-size:48px">🎀 🔐 💕</div>
<h1>Caro, tenés una sorpresa</h1>
<p>Una personita preparó algo especialmente para vos… 🤭</p>
<button onclick="descubrir()">Descubrir sorpresa 🎁</button>
<p class="small">Solo apto para maestras especiales ✨</p>
</section>
<section id="sorpresa">
<h1>¡Feliz Día del Maestro, Caro! 💕</h1>
<p>Te quiero mucho 💗</p>
<img src="tarjeta-caro.png" alt="Tarjeta especial para Caro">
<a class="button" href="https://www.youtube.com/shorts/RV_b1BRkDFM" target="_blank" rel="noopener">▶ Ver mi mensaje sorpresa</a>
<p>Con mucho cariño 💕</p>
</section>
</main>
<script>
function descubrir(){
 document.getElementById('inicio').style.display='none';
 document.getElementById('sorpresa').style.display='block';
 const symbols=['#ff78ad','#b990e8','#ffd45c','#75d9c5'];
 for(let i=0;i<75;i++){
   const c=document.createElement('i'); c.className='confetti';
   c.style.left=Math.random()*100+'vw';
   c.style.background=symbols[Math.floor(Math.random()*symbols.length)];
   c.style.setProperty('--x',(Math.random()*220-110)+'px');
   c.style.animationDelay=(Math.random()*.7)+'s';
   document.body.appendChild(c); setTimeout(()=>c.remove(),3800);
 }
}
</script>
</body>
</html>
